# dbt_project/profiles.yml
flight_punctuality: # Same name as in profile: in the dbt_project.yml file
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev: &snowflake # &snowflake: names the block so that prod can re-use ut later
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_TRANSFORMER_USER') }}"
      password: "{{ env_var('SNOWFLAKE_TRANSFORMER_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_TRANSFORMER_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"   # Our base-schemam, dbt_johnny... dbt_indira... dbt_aira.. dbt_christoffer 
      threads: 4
    prod:
      <<: *snowflake # Everything from dev
      schema: dbt_prod   